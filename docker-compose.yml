services:
  frontend:
    build: ./frontend
    container_name: mochikorov-frontend
    ports:
      - "8080:80"
    networks:
      - frontend-network
      - backend-network
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  app:
    build: ./backend
    container_name: mochikorov-app
    environment:
      DATABASE_URL: postgres://mochikorov:mochikorov@postgres:5432/mochikorov
      LOKI_URL: http://loki:3100
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/sessions"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: mochikorov-db
    environment:
      POSTGRES_DB: mochikorov
      POSTGRES_USER: mochikorov
      POSTGRES_PASSWORD: mochikorov
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mochikorov -d mochikorov"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: mochikorov-prometheus
    volumes:
      - ./prometheus:/etc/prometheus
    networks:
      - backend-network
    depends_on:
      - app
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: mochikorov-loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: mochikorov-grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    networks:
      - backend-network
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: mochikorov-adminer
    networks:
      - backend-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
    internal: true
