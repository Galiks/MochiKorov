services:
  app:
    build: .
    container_name: mochikorov-app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://mochikorov:mochikorov@postgres:5432/mochikorov
      LOKI_URL: http://loki:3100
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/sessions"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: mochikorov-db
    environment:
      POSTGRES_DB: mochikorov
      POSTGRES_USER: mochikorov
      POSTGRES_PASSWORD: mochikorov
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mochikorov -d mochikorov"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: mochikorov-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    depends_on:
      - app
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: mochikorov-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: mochikorov-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: mochikorov-adminer
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
